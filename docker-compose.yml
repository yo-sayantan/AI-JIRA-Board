# My Jira Board — one-command local deploy.
#
#   docker compose up -d --build      # build + start in the background
#   docker compose logs -f            # watch fetch + server logs
#   docker compose down               # stop
#
# `restart: unless-stopped` means it comes back automatically whenever Docker starts,
# so once it's up you never have to touch the command line again.
# Published host port is fixed via PORT (default 4321). The desktop launcher and
# start-jira-board.sh always set the same PORT so every redeploy lands on one
# dedicated port — never auto-incremented.
services:
  jira-board:
    build: .
    image: jira-board:latest
    container_name: JIRA-Board
    ports:
      - "${PORT:-4321}:4321"
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "4321"
      REFRESH_ON_START: "1"     # fetch once the moment the container starts
      REFRESH_INTERVAL: "900"   # ...then re-fetch every 15 min (0 = off)
      SKIP_SUMMARY: "1"         # no LLM in this container; AI jobs go to jira-ai
      AI_INTERN_URL: http://jira-ai:4322
    volumes:
      # Tokens: reuse your existing connector secrets file, read-only. It just needs
      # JIRA_PERSONAL_TOKEN (and optionally BITBUCKET_PAT / ATLASSIAN_TOKEN).
      - ${HOME}/.cursor/mcp-secrets.env:/root/.cursor/mcp-secrets.env:ro
      # Your personal config (name, corporate id, company URLs), read-only. It lives OUTSIDE
      # the repo so the repo can be public; the container resolves it exactly like the host
      # does ($AI_CONFIG_FILE > ~/.ai/config.json > the in-repo template).
      # Create it BEFORE the first `docker compose up`:
      #     mkdir -p ~/.ai && cp jira-intern/config.json ~/.ai/config.json   (then edit it)
      # If the path is missing Docker silently creates a DIRECTORY there, the parse fails and
      # the board falls back to the repo template — so make the file first.
      - ${HOME}/.ai/config.json:/root/.ai/config.json:ro
      # Persist fetched data on the host (and reuse your current dump). Remove this
      # line for a fully self-contained, ephemeral container that uses the baked data.
      - ./jira-intern:/app/jira-intern
    depends_on:
      - jira-ai
    restart: unless-stopped
    # If auto-refresh / archive logs show "Name or service not known" for
    # your Jira host, Docker's DNS proxy is flapping (common with VPN).
    # Uncomment one of these and recreate the container:
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1
    # Alternative to the secrets mount above — pass tokens directly instead:
    # env_file:
    #   - .env

  ollama:
    image: ollama/ollama:latest
    container_name: JIRA-AI-Ollama
    volumes:
      - jira-ai-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 8

  jira-ai:
    build: ./ai-intern
    image: jira-ai-intern:latest
    container_name: JIRA-AI-Intern
    environment:
      INTERN_DIR: /app/jira-intern
      PORT: "4322"
      OLLAMA_HOST: http://ollama:11434
      HOST_OLLAMA_URL: http://host.docker.internal:11434
      AGENT_SECRETS: /root/.cursor/mcp-secrets.env
    volumes:
      - ./jira-intern:/app/jira-intern
      - ${HOME}/.ai/config.json:/root/.ai/config.json:ro
      - ${HOME}/.cursor/mcp-secrets.env:/root/.cursor/mcp-secrets.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  jira-ai-models:
