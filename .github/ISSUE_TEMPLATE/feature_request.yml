name: ✨ Feature request
description: Suggest an improvement to the board or the fetch
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or use case?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: What would you like to see? A rough sketch is fine.

  - type: dropdown
    id: area
    attributes:
      label: Which part would it touch?
      options:
        - The board UI
        - The fetch / data pipeline (jira-intern)
        - Setup / config / docs
        - Deployment
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
