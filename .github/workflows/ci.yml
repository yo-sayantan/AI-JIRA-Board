name: CI

# Type-check and build on every push / PR to main. This is exactly what the
# Docker image's build stage runs, so a green check means the image will build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build (single-file dist/index.html)
        run: npm run build

      - name: Upload built board
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.html
          if-no-files-found: error
