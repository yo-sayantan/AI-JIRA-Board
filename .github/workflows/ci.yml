name: CI

# Lint the shell layer, validate config, run the Python tests, type-check and build the
# board, then prove the Docker image still builds. The build step is exactly what the
# image's build stage runs, so a green check means the image will build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile base image (node:26). Vite 8 needs >= 22.12.
          node-version: 26
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Shellcheck (entrypoint, launchers, runner scripts)
        # -S error only: the runners use a few idioms shellcheck flags at warning level on
        # purpose (sourced files, intentional word splitting), so stylistic findings must
        # not turn CI red.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error docker/docker-entrypoint.sh scripts/start-jira-board.sh scripts/open-guide.sh jira-intern/local-runner/*.sh

      - name: Validate project config
        run: npm run config:validate

      - name: Python tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build (single-file dist/index.html)
        run: npm run build

      - name: Upload built board
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.html
          if-no-files-found: error

      - name: Docker build smoke test
        run: docker build -f docker/Dockerfile -t ci-smoke .
