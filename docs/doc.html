<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236d5bd0%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233b82f6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2256%22%20height%3D%2256%22%20rx%3D%2216%22%20fill%3D%22url(%23g)%22%2F%3E%3Cpath%20d%3D%22M23%2026a9%209%200%200%201%2018%200c0%204.5-3.4%206.3-5.8%208-1.9%201.3-3.2%202.6-3.2%205%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%225.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2249%22%20r%3D%223.6%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E" />
    <title>My Jira Board — Documentation</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef1f7; --bg2: #e6eaf3; --card: #ffffff; --ink: #131722; --soft: #43506a; --muted: #74809a;
        --line: rgba(20, 28, 48, 0.12); --line2: rgba(20, 28, 48, 0.07);
        --brand: #6d5bd0; --brand2: #3b82f6;
        --code-bg: #0f1524; --code-ink: #e6ebf5;
        --ok: #16a34a; --warn: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11141a; --bg2: #161a21; --card: #1b1f27; --ink: #f3f6fb; --soft: #d4dbe8; --muted: #9da7b8;
          --line: rgba(255, 255, 255, 0.14); --line2: rgba(255, 255, 255, 0.07);
          --code-bg: #0b0f1a; --ok: #4ade80; --warn: #fbbf24;
        }
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 110px; }
      body {
        margin: 0; background: var(--bg); color: var(--ink); line-height: 1.68;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      nav.top {
        position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border-bottom: 1px solid var(--line); padding: 10px 20px;
      }
      nav.top .inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      nav.top .brand { font-weight: 800; font-size: 14px; margin-right: 6px; letter-spacing: -0.01em; white-space: nowrap; }
      nav.top .brand a { color: inherit; text-decoration: none; }
      nav.top a.pill {
        font-size: 12px; font-weight: 600; color: var(--soft); text-decoration: none;
        padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
      }
      nav.top a.pill:hover { border-color: var(--line); background: var(--card); color: var(--ink); }
      nav.top a.pill.on { background: var(--ink); color: var(--bg); border-color: transparent; }

      .layout { max-width: 1280px; margin: 0 auto; padding: 26px 24px 90px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 44px; align-items: start; }
      aside.toc { display: none; }
      @media (min-width: 1080px) {
        .layout { grid-template-columns: 220px minmax(0, 1fr); }
        aside.toc { display: block; position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 92px); overflow-y: auto; padding: 8px 0 24px; }
      }
      .toc .toc-h { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 8px 13px; }
      .toc a { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 5px 12px; border-left: 2px solid var(--line2); transition: color 0.15s, border-color 0.15s; }
      .toc a.h3 { padding-left: 24px; font-weight: 500; font-size: 12px; }
      .toc a:hover { color: var(--ink); border-left-color: var(--line); }
      .toc a.on { color: var(--brand2); border-left-color: var(--brand2); background: color-mix(in srgb, var(--brand2) 7%, transparent); }

      main.content { min-width: 0; }
      .doc-card {
        background: var(--card); border: 1px solid var(--line); border-radius: 18px;
        padding: 30px 38px 36px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 16px 40px -28px rgba(16, 24, 40, 0.45);
      }
      @media (max-width: 700px) { .doc-card { padding: 20px 18px 26px; } }

      /* ── rendered markdown ─────────────────────────────────────── */
      .md h1 { font-size: 27px; letter-spacing: -0.02em; margin: 0 0 14px; line-height: 1.25; }
      .md h2 { font-size: 20px; letter-spacing: -0.01em; margin: 34px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line2); }
      .md h3 { font-size: 16px; margin: 24px 0 6px; }
      .md h4 { font-size: 14px; margin: 18px 0 4px; }
      .md p { margin: 9px 0; color: var(--soft); }
      .md ul, .md ol { color: var(--soft); padding-left: 22px; margin: 9px 0; }
      .md li { margin: 4.5px 0; }
      .md b, .md strong { color: var(--ink); }
      .md a { color: var(--brand2); }
      .md code { background: var(--line2); padding: 1.5px 6px; border-radius: 6px; font-size: 0.86em; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .md pre {
        background: var(--code-bg); color: var(--code-ink); border-radius: 12px;
        padding: 15px 17px; overflow-x: auto; font-size: 12.6px; line-height: 1.62;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; margin: 12px 0;
      }
      .md pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
      .md blockquote {
        margin: 12px 0; padding: 10px 16px; border-left: 3px solid var(--brand2);
        background: color-mix(in srgb, var(--brand2) 7%, transparent); border-radius: 0 10px 10px 0;
      }
      .md blockquote p { margin: 4px 0; }
      .md hr { border: 0; border-top: 1px solid var(--line2); margin: 26px 0; }
      .md table { width: 100%; border-collapse: collapse; font-size: 13.3px; margin: 12px 0; display: block; overflow-x: auto; }
      .md thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
      .md th, .md td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line2); vertical-align: top; min-width: 90px; }
      .md td { color: var(--soft); }
      .md tbody tr:hover { background: color-mix(in srgb, var(--brand2) 4%, transparent); }

      .err { text-align: center; padding: 60px 20px; color: var(--muted); }
      footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 30px; }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    <nav class="top">
      <div class="inner" id="docnav">
        <span class="brand"><a href="index.html">🎫 My Jira Board</a></span>
      </div>
    </nav>

    <div class="layout">
      <aside class="toc" aria-label="On this page">
        <p class="toc-h">On this page</p>
        <div id="toc"></div>
      </aside>
      <main class="content">
        <article class="doc-card">
          <div class="md" id="md"><div class="err">Loading…</div></div>
        </article>
        <footer>Rendered from <a id="rawlink" href="#">the markdown source</a> · <a href="index.html">back to the setup guide</a></footer>
      </main>
    </div>

    <script>
      // ── The documentation registry: the only files this viewer will open. ──
      var DOCS = [
        ['AGENTS.md', '🤖 Agents'],
        ['FEATURES.md', '✨ Features'],
        ['DATA-FLOW.md', '🔄 Data flow'],
        ['AI-PIPELINE.md', '🧠 AI pipeline'],
        ['INTEGRATIONS.md', '🔌 Integrations'],
        ['RUNTIME.md', '📦 Runtime'],
        ['ARCHITECTURE.md', '🏗️ Architecture'],
        ['USAGE.md', '🧭 Usage'],
        ['DEPLOYMENT.md', '🚀 Deployment'],
        ['SETUP.md', '⚙️ Setup'],
        ['CONFIG.md', '🧩 Config'],
        ['INTERN.md', '🐍 Intern'],
        ['OVERVIEW.md', '📖 Overview'],
      ];
      var param = new URLSearchParams(location.search).get('f') || 'AGENTS.md';
      var entry = DOCS.filter(function (d) { return d[0] === param; })[0] || DOCS[0];
      var file = entry[0];

      // Doc switcher pills in the top nav.
      var nav = document.getElementById('docnav');
      DOCS.forEach(function (d) {
        var a = document.createElement('a');
        a.className = 'pill' + (d[0] === file ? ' on' : '');
        a.href = 'doc.html?f=' + encodeURIComponent(d[0]);
        a.textContent = d[1];
        nav.appendChild(a);
      });
      var rawPath = file; // every document lives in docs/ beside this viewer
      document.getElementById('rawlink').href = rawPath;

      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function slug(s) {
        return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      // Inline markdown on an ALREADY-ESCAPED string: code spans first (protected),
      // then bold, italic, links. Relative *.md links are rewritten back into this viewer.
      function inline(s) {
        var slots = [];
        s = s.replace(/`([^`]+)`/g, function (m, c) {
          slots.push('<code>' + c + '</code>');
          return '\u0000' + (slots.length - 1) + '\u0000';
        });
        s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        s = s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
          var extra = '';
          if (/^https?:\/\//.test(u)) extra = ' target="_blank" rel="noopener noreferrer"';
          else if (/\.md(#[\w-]*)?$/.test(u)) {
            var parts = u.split('#');
            var p = parts[0].replace(/^\.\.\/(setup\/)/, '$1').replace(/^\.\//, '');
            var known = DOCS.some(function (d) { return d[0] === p; });
            if (known) u = 'doc.html?f=' + encodeURIComponent(p) + (parts[1] ? '#' + parts[1] : '');
          }
          return '<a href="' + u + '"' + extra + '>' + t + '</a>';
        });
        return s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return slots[+i]; });
      }

      /** Small block-level markdown renderer — headings, fences, tables, lists,
       *  blockquotes, hr, paragraphs. Enough for this repo's docs; no external libs. */
      function render(src) {
        var lines = src.replace(/\r\n/g, '\n').split('\n');
        var out = [];
        var i = 0;
        var seen = {};
        function heading(level, text) {
          var id = slug(text.replace(/[`*]/g, ''));
          if (seen[id]) id += '-' + (++seen[id]); else seen[id] = 1;
          out.push('<h' + level + ' id="' + id + '">' + inline(esc(text)) + '</h' + level + '>');
        }
        while (i < lines.length) {
          var line = lines[i];
          if (/^```/.test(line)) {                     // fenced code
            var buf = [];
            i++;
            while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
            i++;
            out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
            continue;
          }
          var h = /^(#{1,4})\s+(.*)$/.exec(line);
          if (h) { heading(h[1].length, h[2]); i++; continue; }
          if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
          if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
            var cells = function (l) {
              return l.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return inline(esc(c.trim())); });
            };
            var head = cells(line);
            i += 2;
            var rows = [];
            while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
            out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') +
              '</tr></thead><tbody>' + rows.map(function (r) {
                return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
              }).join('') + '</tbody></table>');
            continue;
          }
          if (/^\s*>/.test(line)) {                    // blockquote
            var q = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*> ?/, ''));
            out.push('<blockquote>' + render(q.join('\n')) + '</blockquote>');
            continue;
          }
          var li = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
          if (li) {                                    // list (one nesting level)
            var ordered = /\d/.test(li[2]);
            var items = [];
            while (i < lines.length) {
              var m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
              if (m) { items.push({ depth: m[1].length >= 2 ? 1 : 0, text: m[3] }); i++; }
              else if (/^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length - 1].text += ' ' + lines[i].trim(); i++; }
              else break;
            }
            var html = '';
            var open = false;
            items.forEach(function (it) {
              if (it.depth === 1) {
                if (!open) { html = html.replace(/<\/li>$/, ''); html += '<ul>'; open = true; }
                html += '<li>' + inline(esc(it.text)) + '</li>';
              } else {
                if (open) { html += '</ul></li>'; open = false; }
                else if (html) html = html;
                html += '<li>' + inline(esc(it.text)) + '</li>';
              }
            });
            if (open) html += '</ul></li>';
            out.push((ordered ? '<ol>' : '<ul>') + html + (ordered ? '</ol>' : '</ul>'));
            continue;
          }
          if (/^\s*$/.test(line)) { i++; continue; }
          var para = [];                               // paragraph
          while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s|^```|^\s*\||^\s*>|^(\s*)([-*]|\d+\.)\s|^\s*---+\s*$/.test(lines[i])) {
            para.push(lines[i++]);
          }
          if (para.length) out.push('<p>' + inline(esc(para.join(' '))) + '</p>');
          else i++;
        }
        return out.join('\n');
      }

      function buildToc() {
        var toc = document.getElementById('toc');
        var hs = document.querySelectorAll('.md h2, .md h3');
        if (!hs.length) return;
        var links = [];
        hs.forEach(function (hEl) {
          var a = document.createElement('a');
          a.href = '#' + hEl.id;
          a.textContent = hEl.textContent;
          if (hEl.tagName === 'H3') a.className = 'h3';
          toc.appendChild(a);
          links.push([hEl, a]);
        });
        if (!('IntersectionObserver' in window)) return;
        var active = null;
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (!en.isIntersecting) return;
            if (active) active.classList.remove('on');
            active = links.filter(function (l) { return l[0] === en.target; })[0];
            active = active && active[1];
            if (active) active.classList.add('on');
          });
        }, { rootMargin: '-80px 0px -70% 0px' });
        links.forEach(function (l) { io.observe(l[0]); });
      }

      fetch(rawPath, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (text) {
          document.getElementById('md').innerHTML = render(text);
          document.title = 'My Jira Board — ' + (document.querySelector('.md h1') || {}).textContent || 'Documentation';
          buildToc();
          if (location.hash) {
            var t = document.getElementById(location.hash.slice(1));
            if (t) t.scrollIntoView();
          }
        })
        .catch(function () {
          document.getElementById('md').innerHTML =
            '<div class="err">Could not load <code>' + esc(file) + '</code>.<br>' +
            'Open it from the served board (<code>localhost:4321/docs/doc.html</code>), or read the raw file at ' +
            '<a href="' + rawPath + '">' + esc(rawPath) + '</a>.</div>';
        });
    </script>
  </body>
</html>
